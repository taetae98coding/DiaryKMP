project_id = "ljsscxmqzsoulswmwsia"

[auth.external.google]
enabled = true
# SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: 콤마 구분 Google client id 목록.
# 형식 "<number>-<hash>.apps.googleusercontent.com". id_token의 aud 검증에 쓰이므로
# 앱이 만드는 모든 aud를 포함한다(Android=웹, WASM=웹, iOS=iOS client, JVM=JVM client). 웹을 맨 앞에.
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
# SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET: 위 목록 첫 번째(웹) client의 OAuth secret.
# 형식 "GOCSPX-...". 네이티브/코드교환 흐름에선 미사용이나 provider 설정상 채워둔다.
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"

[auth.external.apple]
enabled = true
# SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID: 콤마 구분 Apple client id 목록.
# 네이티브 Sign in with Apple은 id_token의 aud가 앱 bundle id이므로 flavor별 bundle id를 넣는다
# (dev="io.github.taetae98coding.diary.dev", real="io.github.taetae98coding.diary").
# Android·JVM·WASM의 웹 Sign in with Apple은 aud가 Services ID이므로 flavor별 Services ID도 함께 넣는다
# (dev="io.github.taetae98coding.diary.dev.web", real="io.github.taetae98coding.diary.web").
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
# secret은 Supabase가 authorization code를 직접 교환하는 OAuth 흐름 전용(.p8 키로 서명한 client secret JWT)이라 선언하지 않는다.
# 웹 흐름도 id_token을 앱이 직접 받아 signInWithIdToken으로 검증하므로 secret이 필요 없다.
# CLI 설정 검증도 apple·google provider는 secret 필수 검사에서 제외한다.

# S3 Vector Buckets는 Pro 플랜 전용 기능인데 CLI가 기본값을 enabled로 두어,
# 무료 티어에서는 config push가 402로 실패한다. 그래서 명시적으로 꺼둔다.
[storage.vector]
enabled = false

[functions.v1-session-google-id-token]
verify_jwt = false

# authorization-code 교환은 secrets set으로 주입한 GOOGLE_CLIENT_SECRETS를 쓴다.
# 형식(JSON): {"<jvm client id>":"GOCSPX-...","<wasm/web client id>":"GOCSPX-..."}
# 요청의 clientId를 키로 secret을 조회한다(clientId 형식은 위 client_id와 동일).
[functions.v1-session-google-authorization-code]
verify_jwt = false

[functions.v1-session-apple-id-token]
verify_jwt = false

# Apple이 form_post로 직접 호출하므로 JWT가 없다. 허용된 앱 복귀 주소로 결과를 넘기기만 한다.
# 웹 앱 출처는 localhost 외에 secrets set으로 주입한 APPLE_SIGN_IN_WEB_ORIGINS(콤마 구분 origin 목록)도 허용한다.
[functions.v1-session-apple-callback]
verify_jwt = false

