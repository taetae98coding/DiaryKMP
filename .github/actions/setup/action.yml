name: 🧰 빌드 환경 준비
description: JDK 21과 CI 전용 Gradle User Home을 준비하고 local.properties를 복원한다

inputs:
  local-properties:
    description: local.properties 내용(secrets.LOCAL_PROPERTIES)
    required: true
  android-sdk:
    description: Android SDK가 반드시 있어야 하는 잡이면 true. 없으면 실패한다
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # 셀프호스트 러너는 개인 PC라 ~/.gradle의 개인 설정을 덮어쓰지 않도록 CI 전용 Gradle User Home을 따로 둔다.
    # 러너 메모리에 맞춘 CI 전용 값이 프로젝트 gradle.properties보다 우선하도록 그 Gradle User Home에 둔다.
    - name: 📝 CI gradle.properties 복사
      shell: bash
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" != "macOS" ]; then
          echo "::error::CI gradle.properties가 없는 러너 OS입니다: $RUNNER_OS"
          exit 1
        fi
        gradle_home="$HOME/.gradle-ci"
        mkdir -p "$gradle_home"
        cat .github/ci.gradle.properties .github/ci-macos.gradle.properties > "$gradle_home/gradle.properties"
        echo "GRADLE_USER_HOME=$gradle_home" >> "$GITHUB_ENV"

    - name: ☕ JDK 21 설치
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21

    # 셀프호스트 러너는 Gradle User Home과 ~/.konan이 잡 사이에 남으므로 GitHub 캐시로 저장·복원하지 않는다.
    - name: 🐘 Gradle 준비
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-disabled: true
        # 실패 원인과 태스크별 소요 시간을 작업 요약의 링크로 바로 보도록 CI 빌드마다 scans.gradle.com에 올린다.
        build-scan-publish: true
        build-scan-terms-of-use-url: https://gradle.com/help/legal-terms-of-use
        build-scan-terms-of-use-agree: 'yes'

    - name: 🔐 local.properties 복원
      shell: bash
      env:
        LOCAL_PROPERTIES: ${{ inputs.local-properties }}
        REQUIRE_ANDROID_SDK: ${{ inputs.android-sdk }}
      run: |
        set -euo pipefail
        printf '%s\n' "$LOCAL_PROPERTIES" > local.properties
        sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
        if [ -d "$sdk" ]; then
          echo "sdk.dir=$sdk" >> local.properties
        elif [ "$REQUIRE_ANDROID_SDK" = "true" ]; then
          echo "::error::Android SDK를 찾지 못했습니다: $sdk"
          exit 1
        fi
