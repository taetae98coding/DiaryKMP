# ubuntu-latest: 4코어, RAM 16GB. 워커는 코어 수(4)를 그대로 쓴다.
# 워커 4개의 Kotlin 컴파일이 Kotlin 데몬 하나의 힙을 나눠 쓰므로, 2GB에서는 Compose 모듈을 동시에 컴파일하다 OOM이 났다.
# Android 호스트 테스트 JVM이 워커마다 최대 2GB를 따로 쓰므로, Kotlin 데몬을 4GB로 올리는 대신 Gradle 데몬을 3GB로 줄여 합이 RAM 안에 들게 한다.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseParallelGC
# Linux 러너는 iOS를 빌드하지 않는다. cinterop이 있는 모듈의 iOS klib 교차 컴파일을 끄고, 꺼진 타깃 안내도 숨긴다.
kotlin.native.enableKlibsCrossCompilation=false
kotlin.native.ignoreDisabledTargets=true
