# ubuntu-latest: 4코어, RAM 16GB. 워커는 코어 수(4)를 그대로 쓴다.
# Android 호스트 테스트 JVM이 워커마다 최대 2GB를 따로 쓰므로 데몬 둘의 힙은 남은 메모리 안에서 잡는다.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC
# Linux 러너는 iOS를 빌드하지 않는다. cinterop이 있는 모듈의 iOS klib 교차 컴파일을 끄고, 꺼진 타깃 안내도 숨긴다.
kotlin.native.enableKlibsCrossCompilation=false
kotlin.native.ignoreDisabledTargets=true
