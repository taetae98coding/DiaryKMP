name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 배포 버전(예. 2.1.0). 비우면 현재 버전의 patch를 1 올린다
        required: false
        type: string
      android:
        description: Android를 Play 내부 테스트로 배포한다
        required: false
        type: boolean
        default: true
      ios:
        description: iOS를 TestFlight로 배포한다
        required: false
        type: boolean
        default: true
      bump:
        description: 버전을 올려 커밋·태그한다. 끄면 main의 현재 버전을 그대로 다시 빌드한다(실패한 플랫폼 재배포용)
        required: false
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # self-hosted 러너는 실행 사이에 홈 디렉터리를 공유하므로, 개발 환경과 섞이지 않게 CI 전용 캐시 위치를 쓴다.
  CI_HOME_DIR: .diary-ci
  BUILD_LOGIC: build-logic/convention/src/main/kotlin/io/github/taetae98coding/diary/buildlogic/BuildLogic.kt
  PBXPROJ: iosApp/DiaryApp.xcodeproj/project.pbxproj

jobs:
  version:
    name: 버전
    runs-on: self-hosted
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      build: ${{ steps.bump.outputs.build }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - id: bump
        name: 버전 계산
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current_name=$(sed -nE 's/.*VERSION_NAME: String = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' "$BUILD_LOGIC")
          current_code=$(sed -nE 's/.*VERSION_CODE: Int = ([0-9]+).*/\1/p' "$BUILD_LOGIC")
          if [ -z "$current_name" ] || [ -z "$current_code" ]; then
            echo "::error::$BUILD_LOGIC 에서 현재 버전을 읽지 못했습니다."
            exit 1
          fi

          if [ "$BUMP" != "true" ]; then
            echo "버전을 올리지 않고 현재 $current_name ($current_code)을 다시 빌드한다."
            echo "version=$current_name" >> "$GITHUB_OUTPUT"
            echo "build=$current_code" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$INPUT_VERSION" ]; then
            if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::버전은 2.1.0 형식이어야 합니다: $INPUT_VERSION"
              exit 1
            fi
            version="$INPUT_VERSION"
          else
            IFS=. read -r major minor patch <<< "$current_name"
            version="$major.$minor.$((patch + 1))"
          fi
          build=$((current_code + 1))

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::태그 $version 이 이미 있습니다."
            exit 1
          fi

          echo "현재 $current_name ($current_code) -> $version ($build)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - id: commit
        name: 버전 커밋과 태그
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BUILD: ${{ steps.bump.outputs.build }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$BUMP" != "true" ]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # self-hosted macOS 러너의 BSD sed와 GNU sed의 -i 문법이 달라 perl로 치환한다.
          perl -pi -e 's/(VERSION_CODE: Int = )\d+/${1}$ENV{BUILD}/' "$BUILD_LOGIC"
          perl -pi -e 's/(VERSION_NAME: String = ")[\d.]+(")/${1}$ENV{VERSION}${2}/' "$BUILD_LOGIC"
          perl -pi -e 's/(CURRENT_PROJECT_VERSION = )\d+;/${1}$ENV{BUILD};/' "$PBXPROJ"
          perl -pi -e 's/(MARKETING_VERSION = )[\d.]+;/${1}$ENV{VERSION};/' "$PBXPROJ"
          git diff --stat

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: 앱을 $VERSION ($BUILD) 버전으로 올린다"
          git tag -a "$VERSION" -m "$VERSION ($BUILD)"
          git push origin HEAD:main
          git push origin "$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  android:
    name: Android → Play 내부 테스트
    needs: version
    if: inputs.android
    runs-on: [self-hosted, releaseAndroid]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          clean: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: CI 전용 캐시 위치 설정
        run: |
          set -euo pipefail
          ci="$HOME/$CI_HOME_DIR"
          mkdir -p "$ci/gradle"
          # 실행 사이에 캐시는 유지하되 개발자의 ~/.gradle, ~/.konan과는 섞지 않는다.
          {
            echo "GRADLE_USER_HOME=$ci/gradle"
            echo "KONAN_DATA_DIR=$ci/konan"
          } >> "$GITHUB_ENV"
          # 빌드가 끝난 뒤 Gradle·Kotlin 데몬이 개발 머신의 메모리를 붙잡지 않게 한다.
          printf '%s\n' 'org.gradle.daemon=false' 'kotlin.compiler.execution.strategy=in-process' > "$ci/gradle/gradle.properties"

      - name: 비밀 파일 복원
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          ANDROID_REAL_KEYSTORE_BASE64: ${{ secrets.ANDROID_REAL_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_REAL_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_REAL_JSON_BASE64 }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          if [ ! -d "$sdk" ]; then
            echo "::error::Android SDK를 찾지 못했습니다: $sdk"
            exit 1
          fi
          printf '%s\n' "$LOCAL_PROPERTIES" > local.properties
          echo "sdk.dir=$sdk" >> local.properties
          mkdir -p app/android/keystore app/android/src/real
          echo "$ANDROID_REAL_KEYSTORE_BASE64" | base64 -d > app/android/keystore/real.jks
          echo "$GOOGLE_SERVICES_REAL_JSON_BASE64" | base64 -d > app/android/src/real/google-services.json

      - name: AAB 빌드
        run: ./gradlew :app:android:bundleRealRelease -Pbuildkonfig.flavor=real

      - name: real 설정 확인
        run: |
          set -euo pipefail
          aab=app/android/build/outputs/bundle/realRelease/android-real-release.aab
          host=$(sed -nE 's#^real\.supabase\.url=https?://([^/]+).*#\1#p' local.properties)
          unzip -p "$aab" 'base/dex/*.dex' | strings | grep -q "$host" \
            || { echo "::error::AAB에 real Supabase 주소가 없습니다. -Pbuildkonfig.flavor=real 로 빌드됐는지 확인하세요."; exit 1; }

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.taetae98coding.diary
          releaseFiles: app/android/build/outputs/bundle/realRelease/android-real-release.aab
          releaseName: ${{ needs.version.outputs.version }} (${{ needs.version.outputs.build }})
          tracks: internal
          status: completed

      - name: 비밀 파일 삭제
        if: always()
        run: rm -f local.properties app/android/keystore/real.jks app/android/src/real/google-services.json

  ios:
    name: iOS → TestFlight
    needs: version
    if: inputs.ios
    runs-on: [self-hosted, releaseiOS]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          clean: true

      - name: Xcode 27 선택
        run: |
          set -euo pipefail
          # 개발 머신의 xcode-select 설정을 바꾸지 않도록 이 잡에서만 DEVELOPER_DIR로 고른다.
          xcode=""
          for app in /Applications/Xcode_27*.app /Applications/Xcode.app; do
            [ -d "$app" ] || continue
            if DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version 2>/dev/null | head -1 | grep -q '^Xcode 27'; then
              xcode="$app"
              break
            fi
          done
          if [ -z "$xcode" ]; then
            echo "::error::러너에 Xcode 27이 없습니다."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: CI 전용 캐시 위치 설정
        run: |
          set -euo pipefail
          ci="$HOME/$CI_HOME_DIR"
          mkdir -p "$ci/gradle" "$ci/DerivedData"
          {
            echo "GRADLE_USER_HOME=$ci/gradle"
            echo "KONAN_DATA_DIR=$ci/konan"
            echo "CI_DERIVED_DATA=$ci/DerivedData"
          } >> "$GITHUB_ENV"
          printf '%s\n' 'org.gradle.daemon=false' 'kotlin.compiler.execution.strategy=in-process' > "$ci/gradle/gradle.properties"

      - name: 비밀 파일 복원
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          IOS_GOOGLE_SERVICE_INFO_REAL_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_REAL_PLIST_BASE64 }}
          IOS_REAL_LOCAL_XCCONFIG: ${{ secrets.IOS_REAL_LOCAL_XCCONFIG }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s\n' "$LOCAL_PROPERTIES" > local.properties
          mkdir -p iosApp/Firebase/real
          echo "$IOS_GOOGLE_SERVICE_INFO_REAL_PLIST_BASE64" | base64 -d > iosApp/Firebase/real/GoogleService-Info.plist
          printf '%s\n' "$IOS_REAL_LOCAL_XCCONFIG" > iosApp/Config/RealLocal.xcconfig
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"

      # 스킴 이름의 공백이 archive 중간 경로를 가르면 Kotlin SPM 빌드가 modulemap을 찾지 못하므로 공백 없는 사본으로 archive한다.
      - name: archive용 스킴 준비
        run: |
          cp "iosApp/DiaryApp.xcodeproj/xcshareddata/xcschemes/DiaryApp Real.xcscheme" \
             iosApp/DiaryApp.xcodeproj/xcshareddata/xcschemes/DiaryAppRealCI.xcscheme

      # 러너가 launchd 서비스로 돌면 로그인 키체인의 키에 접근하지 못해(errSecInternalComponent) codesign이 실패한다.
      # CI 전용 개발 인증서를 임시 키체인에 넣고 archive 동안만 검색 목록을 그 키체인으로 바꾼다. 배포 서명은 export에서 클라우드 서명을 받는다.
      - name: 임시 키체인 준비
        env:
          IOS_CI_SIGNING_P12_BASE64: ${{ secrets.IOS_CI_SIGNING_P12_BASE64 }}
          IOS_CI_SIGNING_P12_PASSWORD: ${{ secrets.IOS_CI_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/diary-ci.keychain-db"
          password=$(openssl rand -hex 16)
          security list-keychains -d user | tr -d '"' | xargs > "$RUNNER_TEMP/keychains.orig"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$IOS_CI_SIGNING_P12_BASE64" | base64 -d > "$RUNNER_TEMP/ci.p12"
          security import "$RUNNER_TEMP/ci.p12" -k "$keychain" -P "$IOS_CI_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/ci.p12"
          # 검색 목록을 임시 키체인으로 좁히면 로그인 키체인의 WWDR 중간 인증서가 빠져 신원이 무효가 되므로 함께 넣는다.
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q '1 valid identities found'; then
            security find-identity -v -p codesigning "$keychain"
            echo "::error::임시 키체인에 유효한 서명 신원이 없습니다."
            exit 1
          fi

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project iosApp/DiaryApp.xcodeproj \
            -scheme DiaryAppRealCI \
            -configuration RealRelease \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CI_DERIVED_DATA" \
            -archivePath "$RUNNER_TEMP/Diary.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: TestFlight 업로드
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>4TV6L66XZ8</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Diary.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: 비밀 파일과 임시 키체인 정리
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/keychains.orig" ]; then
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains.orig")
          fi
          security delete-keychain "$RUNNER_TEMP/diary-ci.keychain-db" 2>/dev/null || true
          rm -f local.properties iosApp/Firebase/real/GoogleService-Info.plist iosApp/Config/RealLocal.xcconfig
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/Diary.xcarchive" "$RUNNER_TEMP/export"
