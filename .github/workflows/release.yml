name: Release

# main은 test를 통과한 PR만 머지되므로 배포에서는 테스트를 다시 돌리지 않는다.
# 버전은 빌드 잡마다 작업 트리에만 적용하고, 고른 플랫폼 배포가 모두 성공하거나 이미 올라가 있을 때만 커밋·태그한다.
# 그래서 실패한 뒤 같은 입력으로 다시 실행하면 같은 버전이 계산되고, 이미 올라간 플랫폼은 건너뛴다.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 배포 버전(예. 2.1.0). 비우면 현재 버전의 patch를 1 올린다
        required: false
        type: string
      android:
        description: Android를 Play 내부 테스트로 배포한다
        required: false
        type: boolean
        default: true
      ios:
        description: iOS를 TestFlight로 배포한다
        required: false
        type: boolean
        default: true
      macos:
        description: macOS 데스크톱 앱을 TestFlight로 배포한다
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUILD_LOGIC: build-logic/convention/src/main/kotlin/io/github/taetae98coding/diary/buildlogic/BuildLogic.kt
  PBXPROJ: iosApp/DiaryApp.xcodeproj/project.pbxproj
  PLAY_PACKAGE: io.github.taetae98coding.diary
  ASC_APP_ID: '6737837814'

jobs:
  version:
    name: 🔢 버전 계산
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      build: ${{ steps.next.outputs.build }}
    steps:
      # 이미 쓴 버전인지 태그로 확인하므로 태그까지 가져온다.
      - name: 📥 소스 가져오기
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true

      - id: next
        name: 🔢 다음 버전 계산
        env:
          INPUT_VERSION: ${{ inputs.version }}
          ANDROID: ${{ inputs.android }}
          IOS: ${{ inputs.ios }}
          MACOS: ${{ inputs.macos }}
        run: |
          set -euo pipefail
          if [ "$ANDROID" != "true" ] && [ "$IOS" != "true" ] && [ "$MACOS" != "true" ]; then
            echo "::error::배포할 플랫폼을 하나 이상 골라야 합니다."
            exit 1
          fi

          current_name=$(sed -nE 's/.*VERSION_NAME: String = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' "$BUILD_LOGIC")
          current_code=$(sed -nE 's/.*VERSION_CODE: Int = ([0-9]+).*/\1/p' "$BUILD_LOGIC")
          if [ -z "$current_name" ] || [ -z "$current_code" ]; then
            echo "::error::$BUILD_LOGIC 에서 현재 버전을 읽지 못했습니다."
            exit 1
          fi

          if [ -n "$INPUT_VERSION" ]; then
            if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::버전은 2.1.0 형식이어야 합니다: $INPUT_VERSION"
              exit 1
            fi
            version="$INPUT_VERSION"
          else
            IFS=. read -r major minor patch <<< "$current_name"
            version="$major.$minor.$((patch + 1))"
          fi
          build=$((current_code + 1))

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::태그 $version 이 이미 있습니다."
            exit 1
          fi

          echo "현재 $current_name ($current_code) -> $version ($build)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  check:
    name: 🔎 스토어 중복 확인
    needs: version
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.play.outputs.exists }}
      ios: ${{ steps.asc.outputs.exists }}
      macos: ${{ steps.asc_macos.outputs.exists }}
    steps:
      - name: 📥 소스 가져오기
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          clean: true

      # Play는 versionCode를 트랙과 무관하게 한 번만 받으므로 같은 번호가 있으면 이미 배포된 것으로 본다.
      - id: play
        name: 🤖 Play에 같은 versionCode가 있는지 확인
        if: inputs.android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          set -euo pipefail
          exists=$(python3 .github/scripts/store_build_exists.py play "$PLAY_PACKAGE" "$BUILD")
          echo "Play versionCode $BUILD 존재: $exists"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - id: asc
        name: 🍎 App Store Connect에 같은 빌드가 있는지 확인
        if: inputs.ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          set -euo pipefail
          exists=$(python3 .github/scripts/store_build_exists.py asc "$ASC_APP_ID" "$VERSION" "$BUILD" IOS)
          echo "App Store Connect iOS $VERSION ($BUILD) 존재: $exists"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - id: asc_macos
        name: 🖥️ App Store Connect에 같은 macOS 빌드가 있는지 확인
        if: inputs.macos
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          set -euo pipefail
          exists=$(python3 .github/scripts/store_build_exists.py asc "$ASC_APP_ID" "$VERSION" "$BUILD" MAC_OS)
          echo "App Store Connect macOS $VERSION ($BUILD) 존재: $exists"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

  android:
    name: 🤖 Android → Play 내부 테스트
    needs: [version, check]
    if: inputs.android && needs.check.outputs.android != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 📥 소스 가져오기
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: 🔢 버전 적용
        uses: ./.github/actions/apply-version
        with:
          version: ${{ needs.version.outputs.version }}
          build: ${{ needs.version.outputs.build }}

      - name: 🧰 빌드 환경 준비
        uses: ./.github/actions/setup
        with:
          local-properties: ${{ secrets.LOCAL_PROPERTIES }}
          android-sdk: 'true'

      - name: 🔐 서명 키·google-services.json 복원
        env:
          ANDROID_REAL_KEYSTORE_BASE64: ${{ secrets.ANDROID_REAL_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_REAL_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_REAL_JSON_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p app/android/keystore app/android/src/real
          echo "$ANDROID_REAL_KEYSTORE_BASE64" | base64 -d > app/android/keystore/real.jks
          echo "$GOOGLE_SERVICES_REAL_JSON_BASE64" | base64 -d > app/android/src/real/google-services.json

      - name: 🏗️ real 릴리스 AAB 빌드
        run: ./gradlew :app:android:bundleRealRelease -Pbuildkonfig.flavor=real

      - name: 🔍 AAB에 real 설정이 들어갔는지 확인
        run: |
          set -euo pipefail
          aab=app/android/build/outputs/bundle/realRelease/android-real-release.aab
          host=$(sed -nE 's#^real\.supabase\.url=https?://([^/]+).*#\1#p' local.properties)
          # grep -q가 먼저 끝나면 앞 명령이 SIGPIPE로 실패해 pipefail에 걸리므로 끝까지 읽는 -c로 센다.
          count=$(unzip -p "$aab" 'base/dex/*.dex' | LC_ALL=C grep -a -c "$host" || true)
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::AAB에 real Supabase 주소가 없습니다. -Pbuildkonfig.flavor=real 로 빌드됐는지 확인하세요."
            exit 1
          fi

      - name: 🚀 Play 내부 테스트에 업로드
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PLAY_PACKAGE }}
          releaseFiles: app/android/build/outputs/bundle/realRelease/android-real-release.aab
          releaseName: ${{ needs.version.outputs.version }} (${{ needs.version.outputs.build }})
          tracks: internal
          status: completed

      - name: 🧹 비밀 파일 삭제
        if: always()
        run: rm -f local.properties app/android/keystore/real.jks app/android/src/real/google-services.json

  ios:
    name: 🍎 iOS → TestFlight
    needs: [version, check]
    if: inputs.ios && needs.check.outputs.ios != 'true'
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - name: 📥 소스 가져오기
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: 🔢 버전 적용
        uses: ./.github/actions/apply-version
        with:
          version: ${{ needs.version.outputs.version }}
          build: ${{ needs.version.outputs.build }}

      # 특정 Xcode를 고정하지 않고 이미지 기본 Xcode로 빌드하되, iOS SDK가 프로젝트의 최소 지원 버전보다 낮으면 archive 전에 멈춘다.
      - name: 🛠️ Xcode 확인
        run: |
          set -euo pipefail
          xcodebuild -version
          target=$(sed -nE 's/.*IPHONEOS_DEPLOYMENT_TARGET = ([0-9.]+);.*/\1/p' "$PBXPROJ" | sort -uV | tail -1)
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $sdk, 최소 지원 버전 $target"
          if [ "$(printf '%s\n%s\n' "$target" "$sdk" | sort -V | head -1)" != "$target" ]; then
            echo "::error::기본 Xcode의 iOS SDK($sdk)가 최소 지원 버전($target)보다 낮습니다."
            exit 1
          fi

      - name: 🧰 빌드 환경 준비
        uses: ./.github/actions/setup
        with:
          local-properties: ${{ secrets.LOCAL_PROPERTIES }}

      - name: 🔐 설정 파일·API 키 복원
        env:
          IOS_GOOGLE_SERVICE_INFO_REAL_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_REAL_PLIST_BASE64 }}
          IOS_REAL_LOCAL_XCCONFIG: ${{ secrets.IOS_REAL_LOCAL_XCCONFIG }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p iosApp/Firebase/real
          echo "$IOS_GOOGLE_SERVICE_INFO_REAL_PLIST_BASE64" | base64 -d > iosApp/Firebase/real/GoogleService-Info.plist
          printf '%s\n' "$IOS_REAL_LOCAL_XCCONFIG" > iosApp/Config/RealLocal.xcconfig
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"

      # 스킴 이름의 공백이 archive 중간 경로를 가르면 Kotlin SPM 빌드가 modulemap을 찾지 못하므로 공백 없는 사본으로 archive한다.
      - name: 📋 공백 없는 archive용 스킴 준비
        run: |
          cp "iosApp/DiaryApp.xcodeproj/xcshareddata/xcschemes/DiaryApp Real.xcscheme" \
             iosApp/DiaryApp.xcodeproj/xcshareddata/xcschemes/DiaryAppRealCI.xcscheme

      # 호스팅 러너의 로그인 키체인에는 서명 인증서가 없으므로 CI 전용 개발 인증서를 임시 키체인에 넣고 검색 목록을 그 키체인으로 바꾼다.
      # 배포 서명은 export에서 클라우드 서명을 받는다.
      - name: 🔑 임시 키체인에 CI 서명 인증서 준비
        env:
          IOS_CI_SIGNING_P12_BASE64: ${{ secrets.IOS_CI_SIGNING_P12_BASE64 }}
          IOS_CI_SIGNING_P12_PASSWORD: ${{ secrets.IOS_CI_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/diary-ci.keychain-db"
          password=$(openssl rand -hex 16)
          security list-keychains -d user | tr -d '"' | xargs > "$RUNNER_TEMP/keychains.orig"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$IOS_CI_SIGNING_P12_BASE64" | base64 -d > "$RUNNER_TEMP/ci.p12"
          security import "$RUNNER_TEMP/ci.p12" -k "$keychain" -P "$IOS_CI_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/ci.p12"
          # 검색 목록을 임시 키체인으로 좁히면 로그인 키체인의 WWDR 중간 인증서가 빠져 신원이 무효가 되므로 함께 넣는다.
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q '1 valid identities found'; then
            security find-identity -v -p codesigning "$keychain"
            echo "::error::임시 키체인에 유효한 서명 신원이 없습니다."
            exit 1
          fi

      - name: 🏗️ RealRelease archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project iosApp/DiaryApp.xcodeproj \
            -scheme DiaryAppRealCI \
            -configuration RealRelease \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -archivePath "$RUNNER_TEMP/Diary.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: 🚀 TestFlight에 업로드
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>4TV6L66XZ8</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Diary.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: 🧹 비밀 파일·임시 키체인 정리
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/keychains.orig" ]; then
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains.orig")
          fi
          security delete-keychain "$RUNNER_TEMP/diary-ci.keychain-db" 2>/dev/null || true
          rm -f local.properties iosApp/Firebase/real/GoogleService-Info.plist iosApp/Config/RealLocal.xcconfig
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/Diary.xcarchive" "$RUNNER_TEMP/export"

  macos:
    name: 🖥️ macOS → TestFlight
    needs: [version, check]
    if: inputs.macos && needs.check.outputs.macos != 'true'
    # Compose는 빌드하는 머신의 아키텍처로만 패키징하므로 Apple Silicon 러너에서 arm64 앱을 만든다.
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      PKG_DIR: app/jvm/build/compose/binaries/main-release/pkg
    steps:
      - name: 📥 소스 가져오기
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: 🔢 버전 적용
        uses: ./.github/actions/apply-version
        with:
          version: ${{ needs.version.outputs.version }}
          build: ${{ needs.version.outputs.build }}

      - name: 🧰 빌드 환경 준비
        uses: ./.github/actions/setup
        with:
          local-properties: ${{ secrets.LOCAL_PROPERTIES }}

      - name: 🔐 프로비저닝 프로파일·API 키 복원
        env:
          MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_PROVISIONING_PROFILE_BASE64 }}
          MAC_RUNTIME_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_RUNTIME_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mac"
          echo "$MAC_PROVISIONING_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/mac/embedded.provisionprofile"
          echo "$MAC_RUNTIME_PROVISIONING_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/mac/runtime.provisionprofile"
          # altool은 이 폴더에서 AuthKey_<키 ID>.p8을 찾는다.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

      # Compose는 Gradle에서 codesign과 productbuild를 직접 부르므로 Xcode 클라우드 서명을 쓸 수 없다.
      # 앱 서명용 Mac App Distribution과 설치 패키지 서명용 Mac Installer Distribution 인증서를 임시 키체인에 넣는다.
      - id: keychain
        name: 🔑 임시 키체인에 배포 인증서 준비
        env:
          MAC_APP_SIGNING_P12_BASE64: ${{ secrets.MAC_APP_SIGNING_P12_BASE64 }}
          MAC_INSTALLER_SIGNING_P12_BASE64: ${{ secrets.MAC_INSTALLER_SIGNING_P12_BASE64 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/diary-mac.keychain-db"
          password=$(openssl rand -hex 16)
          security list-keychains -d user | tr -d '"' | xargs > "$RUNNER_TEMP/keychains.orig"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for p12 in "$MAC_APP_SIGNING_P12_BASE64" "$MAC_INSTALLER_SIGNING_P12_BASE64"; do
            echo "$p12" | base64 -d > "$RUNNER_TEMP/mac.p12"
            security import "$RUNNER_TEMP/mac.p12" -k "$keychain" -P "$MAC_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
            rm -f "$RUNNER_TEMP/mac.p12"
          done
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          # Compose는 identity 앞에 인증서 종류를 붙여 찾으므로 "이름 (팀 ID)" 부분만 넘긴다.
          identity=$(security find-identity -v "$keychain" | sed -nE 's/.*"3rd Party Mac Developer Application: (.*)"$/\1/p' | head -1)
          if [ -z "$identity" ] || ! security find-identity -v "$keychain" | grep -q "3rd Party Mac Developer Installer: $identity"; then
            security find-identity -v "$keychain"
            echo "::error::임시 키체인에 Mac App Distribution과 Mac Installer Distribution 인증서가 함께 있어야 합니다."
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: 🏗️ real Mac App Store 패키지 빌드
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: |
          set -euo pipefail
          ./gradlew :app:jvm:packageReleasePkg \
            -Pbuildkonfig.flavor=real \
            -Pdiary.mac.appStore=true \
            -Pdiary.mac.provisioningProfile="$RUNNER_TEMP/mac/embedded.provisionprofile" \
            -Pdiary.mac.runtimeProvisioningProfile="$RUNNER_TEMP/mac/runtime.provisionprofile" \
            -Pcompose.desktop.mac.sign=true \
            -Pcompose.desktop.mac.signing.identity="$IDENTITY" \
            -Pcompose.desktop.mac.signing.keychain="$KEYCHAIN"

      - name: 🔍 패키지 서명 확인
        run: |
          set -euo pipefail
          pkg=$(find "$PKG_DIR" -name '*.pkg' | head -1)
          if [ -z "$pkg" ]; then
            echo "::error::$PKG_DIR 에 pkg가 없습니다."
            exit 1
          fi
          pkgutil --check-signature "$pkg"
          echo "PKG=$pkg" >> "$GITHUB_ENV"

      - name: 🚀 TestFlight에 업로드
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: xcrun altool --upload-app --type macos --file "$PKG" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: 🧹 비밀 파일·임시 키체인 정리
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/keychains.orig" ]; then
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains.orig")
          fi
          security delete-keychain "$RUNNER_TEMP/diary-mac.keychain-db" 2>/dev/null || true
          rm -f local.properties
          rm -rf "$RUNNER_TEMP/mac" "$HOME/.appstoreconnect/private_keys"

  finalize:
    name: 🏷️ 버전 커밋·태그·GitHub Release
    needs: [version, check, android, ios, macos]
    # 고른 플랫폼이 모두 올라갔거나(성공), 이미 올라가 있거나 배포 대상이 아니어서(skip) 스토어와 저장소의 버전이 어긋나지 않을 때만 남긴다.
    if: >-
      !cancelled()
      && needs.version.result == 'success'
      && needs.check.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.android.result)
      && contains(fromJSON('["success", "skipped"]'), needs.ios.result)
      && contains(fromJSON('["success", "skipped"]'), needs.macos.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 직전 태그와의 차이로 노트를 만들므로 태그까지 모두 가져온다.
      - name: 📥 소스 가져오기
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true

      - name: 🔢 버전 적용
        uses: ./.github/actions/apply-version
        with:
          version: ${{ needs.version.outputs.version }}
          build: ${{ needs.version.outputs.build }}

      - name: 🏷️ 버전 커밋·태그 push
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: 앱을 $VERSION ($BUILD) 버전으로 올린다"
          git tag -a "$VERSION" -m "$VERSION ($BUILD)"
          # 배포 중에 main이 앞서 나갔다면 fast-forward가 아니어서 push가 실패한다. 태그는 main에 들어간 커밋에만 단다.
          git push origin HEAD:main
          git push origin "$VERSION"

      - name: 🚀 Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          set -euo pipefail
          # 러너에 git-cliff가 없어 npm 배포본을 버전을 고정해 실행한다. HEAD가 이번 태그이므로 --current가 직전 태그부터의 커밋을 고른다.
          npx --yes git-cliff@2.14.2 --current --output "$RUNNER_TEMP/release-notes.md"
          gh release create "$VERSION" \
            --verify-tag \
            --title "$VERSION ($BUILD)" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
