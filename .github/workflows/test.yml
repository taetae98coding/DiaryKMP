name: Test

on:
  workflow_dispatch:
  # main에 머지하는 PR은 머지 결과로 같은 검증을 통과해야 한다.
  pull_request:
    branches:
      - main
  workflow_call:
    secrets:
      LOCAL_PROPERTIES:
        required: true

permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 검증은 더 볼 필요가 없다.
concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 포맷·정적 분석·의존성·단위 테스트
    # 포크의 PR에는 비밀 값이 전달되지 않아 local.properties를 만들 수 없으므로 실행하지 않는다.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # 검증 대상이 JVM·Android 단위 테스트와 OS와 무관한 baseline뿐이라 가장 빠르고 메모리가 넉넉한 Linux 러너를 쓴다. iOS 타깃은 Linux에서 건너뛴다.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 📥 소스 가져오기
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: 🧰 빌드 환경 준비
        uses: ./.github/actions/setup
        with:
          local-properties: ${{ secrets.LOCAL_PROPERTIES }}
          android-sdk: 'true'

      - name: 🧪 포맷·정적 분석·의존성·단위 테스트
        run: ./gradlew spotlessCheck detekt dependencyGuard jvmTest testAndroidHostTest --continue

      - name: 📤 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 7

      - name: 🧹 비밀 파일 삭제
        if: always()
        run: rm -f local.properties
