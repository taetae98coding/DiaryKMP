name: Test

on:
  workflow_dispatch:
  # main에 머지하는 PR은 머지 결과로 같은 검증을 통과해야 한다.
  pull_request:
    branches:
      - main

permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 검증은 더 볼 필요가 없다.
concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 포맷·정적 분석·의존성·단위 테스트
    # 포크의 PR에는 비밀 값이 전달되지 않아 local.properties를 만들 수 없으므로 실행하지 않는다.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # 모든 잡을 셀프호스트 러너 한 대(Mac Studio)에서 돌린다. 러너가 하나라 잡을 나눠도 차례로 돌 뿐이므로,
    # 한 잡에서 Gradle 구성을 한 번만 하고 서로 의존하지 않는 검증을 워커로 동시에 돌린다.
    runs-on: diary-macos
    timeout-minutes: 90
    steps:
      - name: 📥 소스 가져오기
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: 🧰 빌드 환경 준비
        uses: ./.github/actions/setup
        with:
          local-properties: ${{ secrets.LOCAL_PROPERTIES }}
          android-sdk: 'true'

      # 한 번의 실행으로 모든 실패를 보도록, 한 검증이 실패해도 나머지를 끝까지 돌린다.
      - name: 🧪 포맷·정적 분석·의존성·단위 테스트
        run: ./gradlew spotlessCheck detekt dependencyGuard jvmTest testAndroidHostTest --continue

      - name: 📤 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 7

      - name: 🧹 비밀 파일 삭제
        if: always()
        run: rm -f local.properties
