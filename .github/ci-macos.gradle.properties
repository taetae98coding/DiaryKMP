# macos-latest: 3코어(M1), RAM 7GB. iOS 배포 잡과 macOS 데스크톱 배포 잡이 쓴다.
# Kotlin/Native를 Gradle 데몬 안에서 돌리면 모듈 컴파일마다 남는 메모리가 데몬 힙에 쌓이므로 태스크마다 별도 프로세스로 돌린다.
# 그러면 데몬은 구성과 조율만 맡아 GC 뒤 1GB 안쪽을 쓴다.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC
org.gradle.workers.max=2
# iOS 잡의 JVM 컴파일은 build-logic뿐이지만, macOS 데스크톱 잡은 모든 모듈을 Kotlin 데몬에서 워커 2개로 컴파일한다.
# 같은 워커 수에서 2GB로 통과했던 Linux 러너보다 여유를 두어 3GB로 잡는다. 힙은 쓰는 만큼만 커지므로 iOS 잡의 메모리는 늘지 않는다.
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseParallelGC
kotlin.native.disableCompilerDaemon=true
# iOS 릴리스 링크는 GC 뒤에도 5GB 가까이 남아 그보다 작은 힙에서는 OOM이 난다. RAM 7GB에서는 swap을 감수한다.
kotlin.native.jvmArgs=-Xmx6g
