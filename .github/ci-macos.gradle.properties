# diary-macos: Mac Studio(M 시리즈 12코어, RAM 32GB) 셀프호스트 러너. 모든 잡이 이 러너 한 대에서 차례로 돈다.
# 같은 PC를 평소에도 쓰므로 코어를 모두 쓰지 않고 워커를 6개로 제한한다.
# Android 호스트 테스트 JVM이 워커마다 최대 2GB를 따로 쓰므로, 데몬 둘(4GB씩)과 합쳐 20GB 안쪽에 든다.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
org.gradle.workers.max=6
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseParallelGC
# Kotlin/Native를 Gradle 데몬 안에서 돌리면 모듈 컴파일마다 남는 메모리가 데몬 힙에 쌓이므로 태스크마다 별도 프로세스로 돌린다.
kotlin.native.disableCompilerDaemon=true
# iOS 릴리스 링크는 GC 뒤에도 5GB 가까이 남아 그보다 작은 힙에서는 OOM이 난다.
kotlin.native.jvmArgs=-Xmx8g
