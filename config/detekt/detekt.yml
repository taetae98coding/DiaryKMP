naming:
  BooleanPropertyNaming:
    active: true
  FunctionNameMaxLength:
    active: true
    maximumFunctionNameLength: 50
    excludes:
      - '**/src/jvmTest/**'
      - '**/src/androidHostTest/**'
  NonBooleanPropertyPrefixedWithIs:
    active: true
    allowSingleTypedGenerics: true
  VariableMaxLength:
    active: true
  FunctionNaming:
    ignoreAnnotated: [ 'Composable' ]
    excludes:
      - '**/src/jvmTest/**'
      - '**/src/androidHostTest/**'

style:
  AlsoCouldBeApply:
    active: true
  ClassOrdering:
    active: true
  CollapsibleIfStatements:
    active: true
  DataClassShouldBeImmutable:
    active: true
  DoubleNegativeExpression:
    active: true
  DoubleNegativeLambda:
    active: true
  ExplicitCollectionElementAccessMethod:
    active: true
  MandatoryBracesLoops:
    active: true
  MultilineRawStringIndentation:
    active: true
  RangeUntilInsteadOfRangeTo:
    active: true
  RedundantConstructorKeyword:
    active: true
#  detekt Gradle 플러그인은 explicitApi를 main 소스셋 태스크에만 전달하므로, main과 test를 함께 분석하는
#  집계 태스크 detekt는 explicit API 모드를 알지 못하고 public 선언을 전부 오탐합니다.
#  detekt가 고치지 않기로 했으므로(https://github.com/detekt/detekt/issues/9063) 소스셋별 태스크로 옮기기 전에는 켜지 않습니다.
#  RedundantVisibilityModifier:
#    active: true
  SpacingAfterPackageAndImports:
    active: true
  StringShouldBeRawString:
    active: true
  UnderscoresInNumericLiterals:
    active: true
  UnnecessaryAny:
    active: true
  UnnecessaryBackticks:
    active: true
  UnnecessaryBracesAroundTrailingLambda:
    active: true
  UnnecessaryFullyQualifiedName:
    active: true
  UnnecessaryInnerClass:
    active: true
  UnnecessaryLet:
    active: true
  UnnecessaryParentheses:
    active: true
    allowForUnclearPrecedence: true
  UnnecessaryReversed:
    active: true
  UnusedImport:
    active: true
  UseDataClass:
    active: true
  UseEmptyCounterpart:
    active: true
  UseIfEmptyOrIfBlank:
    active: true
  UseIfInsteadOfWhen:
    active: true
    ignoreWhenContainingVariableDeclaration: true
  UseLet:
    active: true
#  excludes는 기본값에 추가되지 않고 대체하므로 기본 항목을 함께 적습니다.
  MagicNumber:
    excludes:
      - '**/src/jvmTest/**'
      - '**/src/androidHostTest/**'
      - '**/compose/core/icon/**'
  MaxLineLength:
    maxLineLength: 300
  UnusedPrivateFunction:
    allowedNames: '.*Preview'

complexity:
  CognitiveComplexMethod:
    active: true
  ComplexInterface:
    active: true
  MethodOverloading:
    active: true
  NamedArguments:
    active: true
    excludes:
      - '**/compose/core/icon/**'
  NestedScopeFunctions:
    active: true
  StringLiteralDuplication:
    active: true
  LargeClass:
    excludes:
      - '**/src/jvmTest/**'
      - '**/src/androidHostTest/**'
  LongParameterList:
    excludes:
      - '**/src/jvmTest/**'
      - '**/src/androidHostTest/**'
#  excludes는 기본값에 추가되지 않고 대체하므로 기본 항목을 함께 적습니다.
  TooManyFunctions:
    excludes:
      - '**/src/jvmTest/**'
      - '**/src/androidHostTest/**'

coroutines:
  CoroutineLaunchedInTestWithoutRunTest:
    active: true
  GlobalCoroutineUsage:
    active: true
  SuspendFunInFinallySection:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: true
  InjectDispatcher:
    excludes:
      - '**/*Module.kt'

exceptions:
  ErrorUsageWithThrowable:
    active: true
  ObjectExtendsThrowable:
    active: true
  ThrowingExceptionInMain:
    active: true
  TooGenericExceptionCaught:
    active: false

performance:
  CouldBeSequence:
    active: true
  UnnecessaryInitOnArray:
    active: true
  UnnecessaryPartOfBinaryExpression:
    active: true
  UnnecessaryTypeCasting:
    active: true

potential-bugs:
  CastNullableToNonNullableType:
    active: true
  CastToNullableType:
    active: true
  CharArrayToStringCall:
    active: true
  Deprecation:
    active: true
  DontDowncastCollectionTypes:
    active: true
  ExitOutsideMain:
    active: true
  ImplicitUnitReturnType:
    active: true
  LateinitUsage:
    active: true
    excludes:
      - '**/src/jvmTest/**'
      - '**/src/androidHostTest/**'
  MissingPackageDeclaration:
    active: true
  MissingSuperCall:
    active: true
  MissingUseCall:
    active: true
  NullCheckOnMutableProperty:
    active: true
  NullableToStringCall:
    active: true
  PropertyUsedBeforeDeclaration:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  UnnamedParameterUse:
    active: true
    excludes:
      - '**/compose/core/icon/**'
  UnnecessaryNotNullCheck:
    active: true
