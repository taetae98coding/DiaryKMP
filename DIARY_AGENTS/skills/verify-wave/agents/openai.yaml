interface:
  display_name: "Verify Wave"
  short_description: "규칙·추적 검토, 포맷, 정적 분석, 유닛 테스트 검증 게이트"
  default_prompt: "Use $verify-wave to delegate a diff-scoped rule review and a diff-scoped spec-testcase-test-code traceability review to separate sonnet sessions (continuing the same sessions for re-review rounds) and, while it runs, apply spotlessApply and then run detekt, dependencyGuard and the unit test tasks, each only when the changed files require it. Re-run Gradle only once after the last review fix, and record the pass with DIARY_AGENTS/scripts/verify-stamp.sh record."
